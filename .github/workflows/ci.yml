name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Parser (TS), services DB, privacy checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Parser accuracy report
        run: npm run report | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm run validate:services
      - run: npm run lint:no-network
      - name: TS parser results for parity
        run: npm run -s report:json > ../ts.json
      - uses: actions/upload-artifact@v4
        with:
          name: ts-parser-results
          path: ts.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs the pinned gitleaks binary over the full history. (The gitleaks-action wrapper
      # fails on a branch's first push because the event has no "before" commit to diff from.)
      - name: Install gitleaks 8.21.2
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks git . --no-banner --redact --exit-code 1

  swift:
    name: Parser (Swift) and parity
    runs-on: macos-15
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Swift tests
        run: swift test --package-path ios/Packages/TrialGuardCore
      - uses: actions/download-artifact@v4
        with:
          name: ts-parser-results
      - name: Swift parser results
        run: swift run --package-path ios/Packages/TrialGuardCore -c release tgparse parser-fixtures > swift.json
      - name: Parity
        run: node scripts/parity-compare.mjs ts.json swift.json parity-report.md
      - name: Publish parity report
        if: always()
        run: cat parity-report.md >> "$GITHUB_STEP_SUMMARY" || true
